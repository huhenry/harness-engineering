name: ci
on:
  push: { branches: [main] }
  pull_request:

# Read-only is the safe default for every PR-facing job. The one job that
# pushes harness-badge.json overrides this below, and only exists on a push
# to main -- untrusted pull-request code must never receive a write token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
          package-manager-cache: false
      - run: node --test

  self-assess:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # verify must run before assess: .harness/verify-report.json is the
      # evidence assess's Feedback rung 3 and the L4 gate both read back.
      # Reversing this order would leave assess reading stale-or-missing
      # evidence and failing the min-level gate on a checkout that actually
      # has everything it needs -- a self-inflicted failure of exactly the
      # kind this project exists to prevent.
      - name: Verify our own declared checks
        run: node scripts/verify.mjs . --run
      - name: Assess ourselves
        run: node scripts/assess.mjs . --min-level 4 --out self-report.md

  refresh-badge:
    # A failed dependency normally skips this job. `always()` is essential:
    # the badge must be recomputed from a fresh failed verify report when the
    # test or assessment gate breaks, not keep advertising yesterday's level.
    # The event/ref clauses keep the write token completely out of PR runs.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, self-assess]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Both gates continue long enough for Refresh badge to consume the
      # fresh evidence, then the final step restores their failure status.
      - name: Verify our own declared checks
        id: verify
        continue-on-error: true
        run: node scripts/verify.mjs . --run
      - name: Assess ourselves
        id: assess
        continue-on-error: true
        run: node scripts/assess.mjs . --min-level 4 --out self-report.md
      - name: Refresh badge
        if: always()
        run: |
          node scripts/assess.mjs . --json > "$RUNNER_TEMP/report.json"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/report.json", "utf8"));
            const color = r.level.id >= 4 ? "brightgreen" : r.level.id >= 2 ? "yellow" : "red";
            fs.writeFileSync("harness-badge.json", JSON.stringify({
              schemaVersion: 1,
              label: "harness level",
              message: `L${r.level.id} (${r.score.total}/${r.score.max})`,
              color,
            }, null, 2) + "\n");
          '
          # Only the badge is ever staged here, deliberately -- verify/assess
          # may have touched other untracked files in this workspace (e.g.
          # self-report.md), and `git add harness-badge.json` (not `-A` or
          # `commit -am`) is what keeps this step from accidentally
          # committing any of them. See task-24-brief.md section B2.
          if ! git diff --quiet harness-badge.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add harness-badge.json
            git commit -m "chore: refresh harness badge [skip ci]"
            git push
          fi
      - name: Propagate verification or assessment failure
        if: steps.verify.outcome == 'failure' || steps.assess.outcome == 'failure'
        run: exit 1
